# Start:  docker compose up -d --build     then open http://localhost:8080
# Stop:   docker compose down
# Change the port with ROADMAP_PORT, for example:  ROADMAP_PORT=9000 docker compose up -d
services:
  roadmap:
    build: .
    image: roadmap-builder:1.0
    container_name: roadmap-builder
    ports:
      - "${ROADMAP_PORT:-8080}:80"
    restart: unless-stopped

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app loads nothing from other hosts: scripts, styles and fonts are all served from this container.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    # Subtitles for the guide videos.
    location ~ \.vtt$ {
        types { }
        default_type "text/vtt; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

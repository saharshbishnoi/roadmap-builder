[package]
name = "roadmap-builder"
version = "1.2.0"
description = "Roadmap Builder: an intuitive, interactive roadmap view"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
